name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'fontend/desktop/**'
      - 'fontend/pc/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            fontend/desktop/package-lock.json
            fontend/pc/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: fontend/desktop/src-tauri -> target
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install shared PC dependencies
        run: npm ci --prefix fontend/pc
      - name: Install desktop dependencies
        run: npm ci --prefix fontend/desktop
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: fontend/desktop
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
