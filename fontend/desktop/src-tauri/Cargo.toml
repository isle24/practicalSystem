[package]
name = "practical-system-desktop"
version = "0.3.31"
description = "Practical System desktop client"
edition = "2021"
rust-version = "1.88"

[lib]
name = "practical_system_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tokio-util = { version = "0.7", features = ["rt", "io"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "fs", "io-util", "process"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
rust-embed = "8"
mime_guess = "2"
tempfile = "3"
fs2 = "=0.4.3"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
zeroize = "1.8"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
subtle = "=2.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
